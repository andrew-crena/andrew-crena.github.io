<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Records played live on a turntable and streamed. Listen, watch, or leave a memory in the letter book.">
  <title>From a Fountain · live vinyl</title>
  <script src="../fountain-config.js"></script>
  <style>
    :root { --ink: #000; --bg: #fff; --red: #c00000; --link: #0000ee; color-scheme: light; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 Calibri, Carlito, "Segoe UI", system-ui, sans-serif; }
    body.has-now { padding-bottom: 6.5rem; }
    main { max-width: 34rem; margin: 0 auto;
      padding: max(.75rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 1.5rem max(1rem, env(safe-area-inset-left)); }
    a { color: var(--link); }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .bar { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
    .bar a { display: inline-flex; align-items: center; min-height: 44px; }
    #onair { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: .9rem; text-decoration: line-through; }
    #onair.live { color: var(--red); text-decoration: none; }
    h1 { font-size: 1.9rem; line-height: 1.1; margin: .4rem 0 .15rem; }
    .tag { margin: 0 0 1rem; }

    .options { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .options .actions { display: contents; }
    .options button, .options a.opt { font: inherit; font-size: 1.05rem; min-height: 56px; padding: .6rem; border: 2px solid var(--ink);
      background: var(--bg); color: var(--ink); cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: .45rem; }
    .options:has(#watch[hidden]) a.opt { grid-column: 1 / -1; }
    #listen { grid-column: 1 / -1; min-height: 64px; font-size: 1.3rem; font-weight: 700; background: var(--ink); color: var(--bg); }
    #listen .icon::before { content: '\25B6'; font-size: .8em; }
    #listen[aria-pressed="true"] .icon::before { content: '\25A0'; }
    .status { margin: .6rem 0 .75rem; font-size: .95rem; min-height: 1.4em; }
    .status #badge { font-weight: 700; }
    audio { width: 100%; display: block; margin: 0 0 .75rem; }
    .video-frame iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; }
    #video-panel p { margin: .35rem 0 .75rem; }
    footer { margin-top: 1rem; font-size: .95rem; }

    /* What's playing: a small bar pinned to the bottom of the screen */
    .now { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 2px solid var(--ink);
      padding: .5rem max(1rem, env(safe-area-inset-right)) max(.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
    .now .in { max-width: 34rem; margin: 0 auto; display: flex; gap: .65rem; align-items: center; }
    .now img { width: 60px; height: 60px; object-fit: cover; flex: none; }
    .now .txt { min-width: 0; line-height: 1.25; }
    .now .song { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now a { display: inline-block; margin-top: .1rem; }
  </style>
</head>
<body>
  <!-- Configuration: keep the stream URL in the audio element and direct-audio link in sync.
       Optional: set data-video-id to this session's 11-character YouTube video ID.
       With no video ID, the existing channel embed is kept as a compatibility fallback.
       No passwords, tokens, or private server configuration belong in this file. -->
  <main class="fountain" id="fountain" data-state="ready"
        data-channel="UCaOM2mNthp-3w-bGoTy8MAg" data-video-id="">
    <nav class="bar" aria-label="Site">
      <a href="/projects/">&larr; All projects</a>
      <span id="onair">On air</span>
    </nav>
    <h1>From a Fountain</h1>
    <p class="tag">Records played live, for whoever happens by.</p>

    <div class="options">
      <div class="actions" id="actions" hidden>
        <button id="listen" type="button" aria-pressed="false" aria-controls="audio-panel">
          <span class="icon" aria-hidden="true"></span><span id="listen-label">Listen</span>
        </button>
        <button id="watch" type="button" aria-expanded="false" aria-controls="video-panel"><span id="watch-label">Watch</span></button>
      </div>
      <a class="opt" href="../letters/">Letter book</a>
    </div>

    <p class="status" role="status" aria-live="polite" aria-atomic="true"><span id="badge">A place to listen</span> · <span id="message">Press play to join the audio.</span></p>
    <section id="audio-panel" aria-label="Live audio player">
      <audio id="audio" controls preload="none" aria-label="Live vinyl audio"
             src="https://malika-unflaky-loan.ngrok-free.dev/stream.aac"
             data-alt-src="https://cuddly-doe-adversely.ngrok-free.app/stream.aac https://malika-unflaky-loan.ngrok-free.dev/stream.mp3 https://cuddly-doe-adversely.ngrok-free.app/stream.mp3"></audio>
    </section>
    <section id="video-panel" aria-label="Live video of the turntable" hidden>
      <div class="video-frame" id="video-mount"></div>
      <p><a id="video-fallback" href="https://www.youtube.com/channel/UCaOM2mNthp-3w-bGoTy8MAg/live" target="_blank" rel="noopener">Open the video on YouTube</a></p>
    </section>
    <noscript><p>The audio player above works without JavaScript.</p></noscript>

    <footer>
      <a id="direct-audio" href="https://malika-unflaky-loan.ngrok-free.dev/stream.aac" target="_blank" rel="noopener">Audio only</a> ·
      <a id="direct-video" href="https://www.youtube.com/channel/UCaOM2mNthp-3w-bGoTy8MAg/live" target="_blank" rel="noopener">YouTube</a> ·
      <a href="../docent/">Docent</a>
    </footer>
  </main>

  <div class="now" id="now" role="region" aria-label="Playing now" hidden>
    <div class="in">
      <img id="now-cover" alt="" width="60" height="60" hidden>
      <div class="txt">
        <div class="song" id="now-song"></div>
        <div class="line" id="now-by"></div>
        <div class="line" id="now-meta"></div>
        <a href="../letters/">What does this song bring back?</a>
      </div>
    </div>
  </div>
  <script>
  (() => {
    'use strict';
    const root = document.getElementById('fountain');
    if (!root || root.dataset.initialized) return;
    const get = id => document.getElementById(id);
    const audio = get('audio');
    const listen = get('listen');
    const watch = get('watch');
    const audioPanel = get('audio-panel');
    const videoPanel = get('video-panel');
    const videoMount = get('video-mount');
    let source;
    try {
      source = new URL(audio.getAttribute('src'), document.baseURI);
      if (source.protocol !== 'https:' || source.username || source.password) throw new Error('Invalid stream URL');
    } catch (_) {
      get('message').textContent = 'The audio address needs attention. You can try the video link below.';
      return; // Leave the plain HTML player and links available.
    }
    root.dataset.initialized = '1';
    get('direct-audio').href = source.href;
    // The launcher puts the stream on one of two ngrok addresses, in AAC or MP3;
    // move to the next one whenever a connection attempt fails.
    const sources = [source];
    for (const alt of (audio.dataset.altSrc || '').split(/\s+/).filter(Boolean)) {
      try { const u = new URL(alt); if (u.protocol === 'https:' && !u.username && !u.password) sources.push(u); } catch (_) {}
    }
    let srcIdx = 0;
    const channel = root.dataset.channel || '';
    const videoId = root.dataset.videoId || '';
    const validVideo = /^[A-Za-z0-9_-]{11}$/.test(videoId);
    const validChannel = /^UC[A-Za-z0-9_-]{22}$/.test(channel);
    const videoURL = validVideo ? 'https://www.youtube.com/watch?v=' + videoId :
      (validChannel ? 'https://www.youtube.com/channel/' + channel + '/live' : '');
    if (videoURL) {
      get('video-fallback').href = videoURL;
      get('direct-video').href = videoURL;
    } else {
      watch.hidden = true;
      get('direct-video').hidden = true;
    }

    // Intent belongs to the listener. Player events may report failure, but must
    // never turn a pause/stop into permission to start again.
    let mode = 'idle';
    let intent = false;
    let phase = 'ready';
    let generation = 0;
    let resetting = false;
    let retries = 0;
    let retryTimer = null;
    let watchdog = null;
    let lastTime = 0;
    let lastProgress = 0;
    let stableSince = null;
    const retryDelays = [1000, 2000, 4000, 8000, 15000, 30000];
    const silenceTimeout = 12000; // No playback-clock progress, NOT quiet music.
    const now = () => performance.now();
    const active = () => mode === 'audio' && intent;

    function mediaState(value) {
      try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = value; } catch (_) {}
    }
    function show(next, badge, message) {
      phase = next;
      root.dataset.state = next;
      if (get('badge').textContent !== badge) get('badge').textContent = badge;
      if (get('message').textContent !== message) get('message').textContent = message;
      get('listen-label').textContent = active() ? 'Stop' : 'Listen';
      listen.setAttribute('aria-pressed', String(active()));
      get('watch-label').textContent = mode === 'video' ? 'Close video' : 'Watch';
      watch.setAttribute('aria-expanded', String(mode === 'video'));
      audioPanel.hidden = !active();
      videoPanel.hidden = mode !== 'video';
      mediaState(next === 'playing' ? 'playing' : (mode === 'audio' ? 'paused' : 'none'));
    }
    function cancelRetry() {
      clearTimeout(retryTimer);
      retryTimer = null;
    }
    function clearWork() {
      cancelRetry();
      clearInterval(watchdog);
      watchdog = null;
    }
    function releaseAudio() {
      resetting = true;
      audio.pause();
      audio.removeAttribute('src');
      audio.load(); // Disconnect the live response and discard delayed audio.
    }
    function removeVideo() {
      while (videoMount.firstChild) videoMount.removeChild(videoMount.firstChild);
    }
    function stop(message = 'Tap Listen whenever you want to rejoin.') {
      const returnFocus = document.activeElement === audio;
      intent = false;
      generation++;
      clearWork();
      releaseAudio();
      removeVideo();
      mode = 'idle';
      retries = 0;
      stableSince = null;
      show('paused', 'Paused', message);
      if (returnFocus) listen.focus();
    }
    function unavailable() {
      stop('The audio could not connect. Tap Listen to try again, or use the direct links below.');
      show('unavailable', 'Audio unavailable', get('message').textContent);
    }
    function queueRetry(message = 'The audio connection dropped. Trying to reconnect…') {
      if (!active() || retryTimer !== null) return;
      stableSince = null;
      if (navigator.onLine === false) {
        show('offline', 'Waiting for connection', 'Your device reports no connection. Listening will retry when it returns.');
        return;
      }
      if (retries >= retryDelays.length) { unavailable(); return; }
      srcIdx = (srcIdx + 1) % sources.length;
      const delay = retryDelays[retries++] * (.8 + Math.random() * .4);
      show('reconnecting', 'Reconnecting', message);
      const ticket = generation;
      retryTimer = setTimeout(() => {
        retryTimer = null;
        if (ticket === generation && active()) connect();
      }, delay);
    }
    function playFailure(error, ticket) {
      if (ticket !== generation || !active()) return;
      if (error && error.name === 'NotAllowedError') {
        stop('Tap Listen again to allow sound, or open the audio directly below.');
        show('blocked', 'Tap to play', get('message').textContent);
      } else if (!error || error.name !== 'AbortError') {
        // A missing mount can surface as NotSupportedError; it is not proof of
        // a permanently unsupported codec. Retry a bounded number of times.
        queueRetry('The audio is not available yet. Trying again…');
      }
      // A current AbortError remains covered by the connection watchdog.
    }
    function markPlaying() {
      if (!active() || audio.paused || audio.readyState < 2 || audio.error) return;
      cancelRetry();
      if (phase !== 'playing') stableSince = now();
      get('direct-audio').href = sources[srcIdx].href;
      const stamp = get('onair'); stamp.textContent = 'On air'; stamp.classList.add('live');
      show('playing', 'Playing', 'You’re listening to the turntable stream.');
    }
    function tick() {
      if (!active()) return;
      const time = audio.currentTime;
      if (!audio.paused && time > lastTime + .01) {
        lastTime = time;
        lastProgress = now();
        markPlaying();
        if (stableSince !== null && now() - stableSince >= 20000) retries = 0;
      } else if (now() - lastProgress >= silenceTimeout) {
        queueRetry('The audio has stopped arriving. Trying to reconnect…');
      }
    }
    function connect() {
      if (!active()) return;
      cancelRetry();
      const ticket = ++generation;
      lastTime = 0;
      lastProgress = now();
      stableSince = null;
      resetting = true;
      const url = new URL(sources[srcIdx].href);
      url.searchParams.set('_fountain', Date.now() + '-' + ticket);
      audio.src = url.href;
      audio.load();
      show('connecting', 'Connecting', 'Joining the audio…');
      // Keep play() in the original button event; never await a status fetch first.
      try {
        const attempt = audio.play();
        if (attempt && typeof attempt.catch === 'function') attempt.catch(error => playFailure(error, ticket));
      } catch (error) { playFailure(error, ticket); }
      if (active() && watchdog === null) watchdog = setInterval(tick, 1000);
    }
    function startListening() {
      if (active()) return;
      removeVideo();
      intent = true;
      mode = 'audio';
      retries = 0;
      try {
        if ('mediaSession' in navigator && 'MediaMetadata' in window) {
          navigator.mediaSession.metadata = new MediaMetadata({title: 'From a Fountain', artist: 'Live vinyl'});
        }
      } catch (_) {}
      connect();
    }
    function openVideo() {
      if (mode === 'video') { stop(); return; }
      stop();
      if (!videoURL) return;
      mode = 'video';
      const frame = document.createElement('iframe');
      const embed = validVideo ? new URL('https://www.youtube-nocookie.com/embed/' + videoId) :
        new URL('https://www.youtube.com/embed/live_stream');
      if (!validVideo) embed.searchParams.set('channel', channel);
      embed.searchParams.set('playsinline', '1');
      embed.searchParams.set('rel', '0');
      embed.searchParams.set('autoplay', '0');
      frame.src = embed.href;
      frame.title = 'From a Fountain — optional live video';
      frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      frame.allowFullscreen = true;
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      videoMount.appendChild(frame);
      // Iframe load is not evidence that a stream exists or that sound is playing.
      show('video', 'Video player', 'Press play in the video, or open it on YouTube below.');
    }

    audio.addEventListener('loadstart', () => { resetting = false; });
    audio.addEventListener('playing', () => {
      if (!active()) { audio.pause(); return; }
      lastProgress = now();
      markPlaying();
    });
    audio.addEventListener('waiting', () => {
      if (!active() || phase === 'connecting' || retryTimer !== null) return;
      stableSince = null;
      show('buffering', 'Buffering', 'Waiting for more audio…');
    });
    audio.addEventListener('pause', () => {
      if (active() && audio.paused && !resetting && !audio.error && !audio.ended) stop();
    });
    audio.addEventListener('error', () => { if (audio.error) queueRetry('The audio is not available yet. Trying again…'); });
    audio.addEventListener('ended', () => { if (audio.ended) queueRetry(); });
    // stalled alone can occur while buffered audio keeps playing. The watchdog
    // observes actual playback-clock progress and gives recovery 12 seconds.
    audio.addEventListener('stalled', tick);
    listen.addEventListener('click', () => { if (active()) stop(); else startListening(); });
    watch.addEventListener('click', openVideo);
    for (const id of ['direct-audio', 'direct-video', 'video-fallback']) {
      get(id).addEventListener('click', () => stop('Playback stopped here. Continue in the new tab.'));
    }
    window.addEventListener('online', () => {
      if (active() && phase !== 'playing') { cancelRetry(); connect(); }
    });
    window.addEventListener('offline', () => {
      if (active() && phase !== 'playing') { cancelRetry(); queueRetry(); }
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && active()) tick();
      // Do not pause on screen lock or tab hiding. The OS controls suspension.
    });
    window.addEventListener('pagehide', () => stop());
    if ('mediaSession' in navigator) {
      for (const [action, handler] of Object.entries({play: startListening, pause: stop, stop: stop})) {
        try { navigator.mediaSession.setActionHandler(action, () => handler()); } catch (_) {}
      }
    }
    releaseAudio();
    get('actions').hidden = false;
    show('ready', 'A place to listen', 'Tap Listen to join the audio.');
  })();
  </script>
  <script>
  // What's on the turntable, from the letter book service (addresses in fountain-config.js).
  (() => {
    'use strict';
    if (!window.fountainFetch) return;
    const $ = id => document.getElementById(id);
    const card = $('now'), stamp = $('onair'), cover = $('now-cover');
    function onAir(on) { stamp.classList.toggle('live', on); stamp.setAttribute('aria-label', on ? 'On air' : 'Off air'); }
    function showCard(on) { card.hidden = !on; document.body.classList.toggle('has-now', on); }
    async function check() {
      try {
        const r = await window.fountainFetch('/api/now');
        const n = await r.json();
        onAir(true);
        const on = !!(n.artist && n.source !== 'none');
        showCard(on);
        if (!on) return;
        $('now-song').textContent = n.song || n.album;
        $('now-by').textContent = n.artist;
        $('now-meta').textContent = [n.song && n.album, n.year].filter(Boolean).join(' · ');
        if (n.cover && /^https:\/\//.test(n.cover)) { if (cover.src !== n.cover) cover.src = n.cover; cover.alt = 'Cover of ' + (n.album || n.song); cover.hidden = false; }
        else { cover.hidden = true; cover.removeAttribute('src'); }
      } catch (_) {
        showCard(false);
        // The music can be live without the letter book service; trust the player.
        if ($('fountain').dataset.state !== 'playing') onAir(false);
      }
    }
    check();
    setInterval(() => { if (!document.hidden) check(); }, 20000);
  })();
  </script>
</body>
</html>
